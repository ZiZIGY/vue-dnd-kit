name: Release

# The release bot (release-please). On every push it keeps a release pull request up to date:
# each package's next version and changelog, from the Conventional Commits that touched it.
# Merging that pull request tags the packages it bumps, creates their GitHub releases and
# publishes them to npm, under `latest` (a prerelease version under `next`). A release
# pull request that bumps the core also gets a page in the docs' changelog when its version
# has none: the changes only, until someone writes the real one.
#
# Releases come from master. v2 lives on in the v2 branch.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish every package's current version that npm doesn't have yet
        type: boolean
        default: false
      notes:
        description: Put the changelog page of a released core version into its GitHub release (e.g. 3.1.0)
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      core-version: ${{ steps.release.outputs['packages/core--version'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      # The release pull request was opened or updated in this run.
      prs-created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The core's GitHub release gets the notes of its page in the docs' changelog
  # (docs/content/en/docs/5.changelog/, `version:` in its front matter), with links to the
  # live demos, above the commits release-please listed. A version without a page keeps
  # the commits only. Run by hand with `notes`, it does so for a version released before its
  # page was on master.
  notes:
    name: Release notes
    needs: release-please
    if: needs.release-please.outputs.core == 'true' || inputs.notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Notes from the changelog page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.notes || needs.release-please.outputs.core-version }}
          TAG: ${{ inputs.notes && format('core-v{0}', inputs.notes) || needs.release-please.outputs.core-tag }}
        run: |
          node docs/tools/release-notes.ts "$VERSION" > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog page for $VERSION"
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > commits.md
          # A re-run doesn't add them twice.
          if grep -q 'changelog-page' commits.md; then
            echo "$TAG already has its notes"
            exit 0
          fi
          { cat notes.md; printf '\n---\n\n'; cat commits.md; } > body.md
          gh release edit "$TAG" --notes-file body.md

  # A release pull request that bumps the core gets a page in the docs' changelog when its
  # version has none (docs/tools/changelog-page.ts): the changes, from CHANGELOG.md, and a
  # card on the overview. Write the real page on master before merging (highlights, live
  # demos, upgrade notes): this one then stays out. release-please rebuilds its branch when
  # master moves, and this job runs again after it.
  changelog-page:
    name: Changelog page
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-please--branches--${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: A page for the core's next version
        run: |
          # Only when the pull request releases the core.
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          if git diff --quiet FETCH_HEAD -- packages/core/package.json; then
            echo "The release pull request doesn't release the core"
            exit 0
          fi
          node docs/tools/changelog-page.ts
          if [ -z "$(git status --porcelain -- docs/content)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content
          git commit -m 'docs(changelog): a page for the release, from its changelog'
          git push

  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm Trusted Publishing: no token, the package is published with provenance.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The packages just released, or all of them when run by hand with `publish`.
        path: ${{ fromJSON(inputs.publish && '["packages/core","packages/actions","packages/devtools","packages/nuxt"]' || needs.release-please.outputs.paths) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      # As in CI: actions and devtools are built against the core's (and actions') sources.
      - name: Install
        run: |
          yarn install --frozen-lockfile
          case "${{ matrix.path }}" in
            packages/actions) yarn --cwd ../core install --frozen-lockfile ;;
            packages/devtools)
              yarn --cwd ../core install --frozen-lockfile
              yarn --cwd ../actions install --frozen-lockfile
              ;;
          esac

      # `prepublishOnly` (typecheck, tests, build, package checks) or `prepack` (the Nuxt
      # module's build) run first. A prerelease goes out under `next`, a release under `latest`.
      # A version already on npm (published by hand, or by an earlier attempt) is skipped, so
      # the job can be re-run.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --tag "$tag"
